version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnibrain_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - omnibrain_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrain_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    networks:
      - omnibrain_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: omnibrain_frontend
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - omnibrain_net
    restart: unless-stopped

networks:
  omnibrain_net:
    driver: bridge

volumes:
  qdrant_data:
